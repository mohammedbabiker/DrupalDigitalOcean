---
- name: Ensure /run/sshd privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check if ssh.socket is active (Ubuntu 24.04 socket activation)
  ansible.builtin.command: systemctl is-active ssh.socket
  register: ssh_socket_status
  changed_when: false
  failed_when: false

- name: Switch atomically from ssh.socket to standalone ssh.service
  ansible.builtin.shell: |
    systemctl disable --now ssh.socket
    systemctl stop ssh.service || true
    systemctl daemon-reload
    systemctl enable --now ssh.service
  when: ssh_socket_status.rc == 0
  changed_when: true

- name: Deploy hardened sshd_config with syntax check
  ansible.builtin.copy:
    src: sshd_config
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    backup: true
    validate: "/usr/sbin/sshd -t -f %s"
  notify: reload ssh