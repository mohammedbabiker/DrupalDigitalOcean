- name: Setup hostname
  ansible.builtin.hostname:
    name: "{{ vps_fqdn }}"
    use: systemd

- name: Ensure localhost entry in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.0\.1\s+'
    line: 127.0.0.1 localhost.localdomain localhost
    state: present

- name: Ensure Droplet FQDN entry in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: ".*{{ vps_fqdn | regex_escape }}.*"
    line: "{{ droplet_ip }} {{ vps_fqdn }} {{ vps_hostname }}"
    state: present