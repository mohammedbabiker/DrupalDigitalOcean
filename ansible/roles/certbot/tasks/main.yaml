- name: Install certbot packages
  ansible.builtin.apt:
    pkg:
      - certbot
      - python3-certbot-dns-digitalocean
    state: present
  
- name: Stop nginx service
  ansible.builtin.service:
    name: nginx
    state: stopped

- name: Copy certbot configuration
  ansible.builtin.copy:
    src: files/credential.yaml
    dest: /root/certbot/credentials.yaml
    owner: root
    group: root
    mode: '700'

- name: Copy certbot system services
  ansible.builtin.copy:
    src: files/certbot.service
    dest: /etc/systemd/system/certbot.service
    owner: root
    group: root
    mode: '644'

- name: Certbot timer system services
  ansible.builtin.copy:
    src: files/certbot.timer
    dest: /etc/systemd/system/certbot.timer
    owner: root
    group: root
    mode: '644'

- name: Ensure certbot.timer is started and enable at boot
  ansible.builtin.systemd:
    name: certbot.timer
    state: started
    enabled: yes

- name: Copy certbot installation script
  ansible.builtin.copy:
    src: files/get-certs.sh
    dest: /root/certbot/get-certs.sh
    owner: root
    group: root
    mode: '700'


- name: Run get-cert
  command: "/root/certbot/get-certs.sh"
