---
- name: Install Certbot and Cloudflare DNS plugin
  ansible.builtin.apt:
    pkg:
      - certbot
      - python3-certbot-dns-cloudflare
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create restricted directory for Certbot credentials
  ansible.builtin.file:
    path: /etc/letsencrypt/secrets
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Deploy DNS API credentials securely
  ansible.builtin.template:
    src: credentials.ini.j2
    dest: /etc/letsencrypt/secrets/dns-credentials.ini
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Ensure Certbot renewal deploy-hooks directory exists
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Nginx reload deploy hook for certificate renewals
  ansible.builtin.copy:
    src: reload-nginx.sh
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
    owner: root
    group: root
    mode: "0755"

- name: Obtain initial Let's Encrypt certificate via DNS-01 (runs only once)
  ansible.builtin.command:
    argv:
      - certbot
      - certonly
      - --non-interactive
      - --agree-tos
      - --no-eff-email
      - --email
      - "{{ certbot_email }}"
      - --dns-cloudflare
      - --dns-cloudflare-credentials
      - /etc/letsencrypt/secrets/dns-credentials.ini
      - --dns-cloudflare-propagation-seconds
      - "30"
      - --keep-until-expiring
      - -d
      - "{{ drupal_domain }}"
      - -d
      - "www.{{ drupal_domain }}"
  args:
    creates: "/etc/letsencrypt/live/{{ drupal_domain }}/fullchain.pem"
  notify: reload nginx

- name: Ensure Ubuntu's built-in Certbot renewal timer is enabled and running
  ansible.builtin.systemd:
    name: certbot.timer
    state: started
    enabled: true

- name: Mark certbot role as bootstrapped so future runs skip it
  community.general.ini_file:
    path: /etc/ansible/facts.d/bootstrap.fact
    section: state
    option: certbot_done
    value: "true"
    owner: root
    group: root
    mode: "0644"
    create: true