---
- name: Deploy hardened Drupal Nginx site configuration
  ansible.builtin.template:
    src: drupal.conf.j2
    dest: /etc/nginx/sites-available/drupal.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Enable Drupal Nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/drupal.conf
    dest: /etc/nginx/sites-enabled/drupal.conf
    state: link
  notify: reload nginx

- name: Remove legacy unsuffixed drupal symlink if present
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/drupal
    state: absent
  notify: reload nginx

- name: Remove stock Nginx default site if present
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Validate Nginx configuration syntax
  ansible.builtin.command: nginx -t
  changed_when: false
