---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove default Ubuntu welcome page
  ansible.builtin.file:
    path: /var/www/html/index.nginx-debian.html
    state: absent

- name: Remove stock Nginx default site symlink
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Deploy global Nginx hardening and upload limits
  ansible.builtin.copy:
    src: 99-hardening.conf
    dest: /etc/nginx/conf.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Deploy catch-all default_server block
  ansible.builtin.copy:
    src: 00-catchall.conf
    dest: /etc/nginx/sites-available/00-catchall.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Enable catch-all default_server site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/00-catchall.conf
    dest: /etc/nginx/sites-enabled/00-catchall.conf
    state: link
  notify: reload nginx

- name: Ensure Nginx is started and enabled on boot
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
