# Hide Nginx version and OS from Server headers and error pages
server_tokens off;

# Match PHP post_max_size (72M) so Drupal uploads do not hit 413 errors
client_max_body_size 72m;

# Mitigate slow-request / Slowloris attacks
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 30s;
reset_timedout_connection on;