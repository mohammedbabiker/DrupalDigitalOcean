server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Keep ACME HTTP-01 path open in case Certbot runs before the Drupal vhost
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Silently close all other direct-IP or unknown-Host requests
    location / {
        return 444;
    }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}