- name: Set root password for MariaDB (localhost)
  community.mysql.mysql_user:
    name: root
    host: localhost
    password: "{{ db_root_password }}"
    login_user: root
    login_password: "{{ db_root_password }}"
    column_case_sensitive: true
    check_implicit_admin: true
    login_unix_socket: /var/run/mysqld/mysqld.sock
    state: present
  no_log: true

- name: Remove anonymous users
  community.mysql.mysql_user:
    name: ""
    host_all: true
    state: absent
    login_user: root
    login_password: "{{ db_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    column_case_sensitive: true
  no_log: true

- name: Disallow root login remotely
  community.mysql.mysql_user:
    name: root
    host: "{{ item }}"
    state: absent
    login_user: root
    login_password: "{{ db_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    column_case_sensitive: true
  loop:
    - "%"
    - "::1"
    - "0.0.0.0"
  no_log: true

- name: Remove test database
  community.mysql.mysql_db:
    name: test
    state: absent
    login_user: root
    login_password: "{{ db_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  no_log: true
  
- name: Create Drupal database with utf8mb4 encoding
  community.mysql.mysql_db:
    name: "{{ drupal_db_name }}"
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    state: present
    login_user: root
    login_password: "{{ db_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  no_log: true
  
- name: Create Drupal database user and grant database-only privileges
  community.mysql.mysql_user:
    name: "{{ drupal_db_user }}"
    host: "{{ item }}"
    password: "{{ drupal_db_pass }}"
    priv: "{{ drupal_db_name }}.*:ALL"
    append_privs: false
    state: present
    login_user: root
    login_password: "{{ db_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    column_case_sensitive: true
  loop:
    - localhost
    - 127.0.0.1
  no_log: true

- name: Mark database role as bootstrapped so future runs skip it
  community.general.ini_file:
    path: /etc/ansible/facts.d/bootstrap.fact
    section: state
    option: database_done
    value: "true"
    owner: root
    group: root
    mode: "0644"
    create: true
 