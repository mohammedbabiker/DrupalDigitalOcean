# https://unix.stackexchange.com/questions/13751/kernel-inotify-watch-limit-reached
# --- Routing & Binding ---
# Keep at 0 for a standalone Drupal server; switch to 1 only when using br0/Docker
# (and pair with :FORWARD DROP in iptables.rules)
net.ipv4.ip_forward = 0
net.ipv4.ip_nonlocal_bind = 1

# --- File Watchers ---
fs.inotify.max_user_watches = 204800

# --- Network Attack Hardening ---
# Protect against SYN flood attacks
net.ipv4.tcp_syncookies = 1

# Loose reverse-path filtering (blocks spoofed traffic safely with DO Reserved IPs & br0)
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# Ignore ICMP redirects and source-routed packets (prevents routing MITM)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Ignore broadcast pings (Smurf attacks) and malformed ICMP errors
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# --- Kernel Info Leak Protection ---
# Prevent non-root users (like www-data) from reading kernel logs or memory pointers
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2
