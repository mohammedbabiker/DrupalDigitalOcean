---
- name: Harden sites/default directory (readable by www-data, writable only by root)
  ansible.builtin.file:
    path: /var/www/drupal/sites/default
    state: directory
    owner: root
    group: www-data
    mode: "0755"

- name: Copy default.settings.php to settings.php if missing
  ansible.builtin.copy:
    src: /var/www/drupal/sites/default/default.settings.php
    dest: /var/www/drupal/sites/default/settings.php
    remote_src: true
    force: false
    owner: root
    group: www-data
    mode: "0440"

- name: Write database credentials and config_sync_directory into settings.php
  ansible.builtin.blockinfile:
    path: /var/www/drupal/sites/default/settings.php
    insertafter: EOF
    marker: "// {mark} ANSIBLE MANAGED DRUPAL DB SETTINGS"
    block: |
      $databases['default']['default'] = array (
        'database' => '{{ drupal_db_name }}',
        'username' => '{{ drupal_db_user }}',
        'password' => '{{ drupal_db_pass }}',
        'prefix' => '',
        'host' => 'localhost',
        'port' => '3306',
        'isolation_level' => 'READ COMMITTED',
        'driver' => 'mysql',
        'namespace' => 'Drupal\\mysql\\Driver\\Database\\mysql',
        'autoload' => 'core/modules/mysql/src/Driver/Database/mysql/',
      );
      $settings['hash_salt'] = '{{ drupal_hash_salt }}';
      $settings['config_sync_directory'] = '/var/www/drupal/config/sync';
      $settings['trusted_host_patterns'] = [
        '^{{ drupal_domain | regex_escape() }}$',
        '^www\.{{ drupal_domain | regex_escape() }}$',
      ];
  no_log: true

- name: Check if Drupal database already contains tables
  community.mysql.mysql_query:
    login_user: root
    login_password: "{{ db_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_db: "{{ drupal_db_name }}"
    query: "SELECT COUNT(*) AS table_count FROM information_schema.tables WHERE table_schema = %(db)s"
    named_args:
      db: "{{ drupal_db_name }}"
  register: drupal_db_tables
  no_log: true

- name: Set db_is_empty helper fact
  ansible.builtin.set_fact:
    db_is_empty: "{{ (drupal_db_tables.query_result[0][0].table_count | int) == 0 }}"

- name: Ensure gnupg is installed for encrypted backup restore
  ansible.builtin.apt:
    name: gnupg
    state: present
  when: db_is_empty

- name: Check for local encrypted database backup on Mac
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/drupal-backups/latest-db.sql.gz.gpg"
  register: local_db_backup
  when: db_is_empty

- name: Check for local encrypted media archive on Mac
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/drupal-backups/latest-files.tar.gz.gpg"
  register: local_files_backup
  when: db_is_empty

- name: Restore encrypted DB and media from local Mac backup (fresh server only)
  when:
    - db_is_empty
    - local_db_backup.stat.exists
  block:
    - name: Create temporary root-only restore workspace on VPS
      ansible.builtin.file:
        path: /tmp/drupal-restore
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Write temporary passphrase file on VPS
      ansible.builtin.copy:
        content: "{{ backup_passphrase }}\n"
        dest: /tmp/drupal-restore/.pass
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Upload encrypted database backup from Mac to VPS
      ansible.builtin.copy:
        src: "{{ lookup('env', 'HOME') }}/drupal-backups/latest-db.sql.gz.gpg"
        dest: /tmp/drupal-restore/latest-db.sql.gz.gpg
        owner: root
        group: root
        mode: "0600"

    - name: Decrypt and import database into MariaDB
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          gpg --batch --yes --decrypt --passphrase-file /tmp/drupal-restore/.pass /tmp/drupal-restore/latest-db.sql.gz.gpg \
            | gunzip \
            | sudo -u www-data HOME=/tmp /var/www/drupal/vendor/bin/drush --root=/var/www/drupal sql:cli
        executable: /bin/bash

    - name: Upload encrypted media archive from Mac to VPS
      when: local_files_backup.stat.exists
      ansible.builtin.copy:
        src: "{{ lookup('env', 'HOME') }}/drupal-backups/latest-files.tar.gz.gpg"
        dest: /tmp/drupal-restore/latest-files.tar.gz.gpg
        owner: root
        group: root
        mode: "0600"

    - name: Decrypt and restore sites/default/files media directory
      when: local_files_backup.stat.exists
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          mkdir -p /var/www/drupal/sites/default/files
          gpg --batch --yes --decrypt --passphrase-file /tmp/drupal-restore/.pass /tmp/drupal-restore/latest-files.tar.gz.gpg \
            | tar -xzf - -C /var/www/drupal/sites/default/files
        executable: /bin/bash

  always:
    - name: Remove temporary restore workspace and passphrase from VPS
      ansible.builtin.file:
        path: /tmp/drupal-restore
        state: absent

- name: Ensure sites/default/files is writable by www-data without making files executable
  ansible.builtin.file:
    path: /var/www/drupal/sites/default/files
    state: directory
    owner: www-data
    group: www-data
    mode: "u=rwX,g=rX,o="
    recurse: true

- name: Check if exported Drupal config exists in config/sync
  ansible.builtin.find:
    paths: /var/www/drupal/config/sync
    patterns: "*.yml"
  register: drupal_config_files

- name: Run Drupal database updates
  become_user: www-data
  environment:
    HOME: /tmp
  ansible.builtin.command:
    cmd: /var/www/drupal/vendor/bin/drush --root=/var/www/drupal --uri="https://{{ drupal_domain }}" updatedb -y
    chdir: /var/www/drupal
  register: drush_updb
  changed_when: "'No pending updates' not in drush_updb.stderr and 'No pending updates' not in drush_updb.stdout"

- name: Import Drupal configuration if sync files exist
  become_user: www-data
  environment:
    HOME: /tmp
  ansible.builtin.command:
    cmd: /var/www/drupal/vendor/bin/drush --root=/var/www/drupal --uri="https://{{ drupal_domain }}" config:import -y
    chdir: /var/www/drupal
  when: drupal_config_files.matched | int > 0
  register: drush_cim
  changed_when: "'There are no changes to import' not in drush_cim.stdout and 'There are no changes to import' not in drush_cim.stderr"

- name: Rebuild Drupal cache
  become_user: www-data
  environment:
    HOME: /tmp
  ansible.builtin.command:
    cmd: /var/www/drupal/vendor/bin/drush --root=/var/www/drupal --uri="https://{{ drupal_domain }}" cache:rebuild
    chdir: /var/www/drupal
  changed_when: false