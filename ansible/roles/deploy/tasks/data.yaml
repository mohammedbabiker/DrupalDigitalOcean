---
- name: Check if Drupal database already contains tables
  community.mysql.mysql_query:
    login_user: root
    login_password: "{{ db_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_db: "{{ drupal_db_name }}"
    query: "SELECT COUNT(*) AS table_count FROM information_schema.tables WHERE table_schema = %(db)s"
    named_args:
      db: "{{ drupal_db_name }}"
  register: drupal_db_tables
  no_log: true

- name: Bootstrap empty Drupal database from initial dump (runs only once)
  when: (drupal_db_tables.query_result[0][0].table_count | int) == 0
  block:
    - name: Create restricted temporary directory for SQL extraction
      ansible.builtin.file:
        path: /root/.tmp_drupal_db
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Unzip password-protected database archive
      ansible.builtin.command:
        argv:
          - unzip
          - -o
          - -P
          - "{{ db_zip_password }}"
          - /var/www/drupal/db/data.zip
          - -d
          - /root/.tmp_drupal_db/
        creates: /tmp/db/data.sql.gz
      no_log: true

    - name: Decompress gzipped SQL dump
      ansible.builtin.command:
        cmd: gzip -df /root/.tmp_drupal_db/db/data.sql.gz

    - name: Strip hardcoded CREATE DATABASE and USE statements from SQL dump
      ansible.builtin.replace:
        path: /root/.tmp_drupal_db/db/data.sql
        regexp: '(?im)^(CREATE DATABASE|USE)\s+.*;'
        # regexp: '^(CREATE DATABASE|USE)\s+`?[^`;]+`?;'
        replace: '-- \g<0>'

    - name: Import SQL file into existing MySQL database
      community.mysql.mysql_db:
        name: "{{ drupal_db_name }}"
        state: import
        target: /root/.tmp_drupal_db/db/data.sql
        login_user: root
        login_password: "{{ db_root_password }}"
        login_unix_socket: /var/run/mysqld/mysqld.sock
      no_log: true

  always:
    - name: Remove temporary SQL extraction directory unconditionally
      ansible.builtin.file:
        path: /root/.tmp_drupal_db
        state: absent
  
- name: Harden sites/default directory (readable by www-data, writable only by root)
  ansible.builtin.file:
    path: /var/www/drupal/sites/default
    state: directory
    owner: root
    group: www-data
    mode: "0755"

- name: Ensure sites/default/files is writable by www-data without making files executable
  ansible.builtin.file:
    path: /var/www/drupal/sites/default/files
    state: directory
    owner: www-data
    group: www-data
    mode: "u=rwX,g=rX,o="
    recurse: true

- name: Copy default.settings.php to settings.php if missing
  ansible.builtin.copy:
    src: /var/www/drupal/sites/default/default.settings.php
    dest: /var/www/drupal/sites/default/settings.php
    remote_src: true
    force: false
    owner: root
    group: www-data
    mode: "0440"

- name: Write database credentials and config_sync_directory into settings.php
  ansible.builtin.blockinfile:
    path: /var/www/drupal/sites/default/settings.php
    insertafter: EOF
    marker: "// {mark} ANSIBLE MANAGED DRUPAL DB SETTINGS"
    block: |
      $databases['default']['default'] = array (
        'database' => '{{ drupal_db_name }}',
        'username' => '{{ drupal_db_user }}',
        'password' => '{{ drupal_db_pass }}',
        'prefix' => '',
        'host' => 'localhost',
        'port' => '3306',
        'isolation_level' => 'READ COMMITTED',
        'driver' => 'mysql',
        'namespace' => 'Drupal\\mysql\\Driver\\Database\\mysql',
        'autoload' => 'core/modules/mysql/src/Driver/Database/mysql/',
      );
      $settings['hash_salt'] = '{{ drupal_hash_salt }}';
      $settings['config_sync_directory'] = '/var/www/drupal/config/sync';
      $settings['trusted_host_patterns'] = [
        '^{{ drupal_domain | regex_escape() }}$',
        '^www\.{{ drupal_domain | regex_escape() }}$',
      ];

- name: Check if exported Drupal config exists in config/sync
  ansible.builtin.find:
    paths: /var/www/drupal/config/sync
    patterns: "*.yml"
  register: drupal_config_files

- name: Run Drupal database updates
  become_user: www-data
  environment:
    HOME: /tmp
  ansible.builtin.command:
    cmd: /var/www/drupal/vendor/bin/drush --root=/var/www/drupal --uri="https://{{ drupal_domain }}" updatedb -y
    chdir: /var/www/drupal
  register: drush_updb
  changed_when: "'No pending updates' not in drush_updb.stderr and 'No pending updates' not in drush_updb.stdout"

- name: Import Drupal configuration if sync files exist
  become_user: www-data
  environment:
    HOME: /tmp
  ansible.builtin.command:
    cmd: /var/www/drupal/vendor/bin/drush --root=/var/www/drupal --uri="https://{{ drupal_domain }}" config:import -y
    chdir: /var/www/drupal
  when: drupal_config_files.matched | int > 0
  register: drush_cim
  changed_when: "'There are no changes to import' not in drush_cim.stdout and 'There are no changes to import' not in drush_cim.stderr"

- name: Rebuild Drupal cache
  become_user: www-data
  environment:
    HOME: /tmp
  ansible.builtin.command:
    cmd: /var/www/drupal/vendor/bin/drush --root=/var/www/drupal --uri="https://{{ drupal_domain }}" cache:rebuild
    chdir: /var/www/drupal
  changed_when: false
