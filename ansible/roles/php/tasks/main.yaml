---
- name: Install prerequisite for managing APT PPAs
  ansible.builtin.apt:
    name: software-properties-common
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add Ondrej PHP PPA repository
  ansible.builtin.apt_repository:
    repo: ppa:ondrej/php
    state: present
    update_cache: true
    
- name: Include PHP installation tasks
  ansible.builtin.include_tasks: php-installation.yaml

- name: Include PHP configuration tasks
  ansible.builtin.include_tasks: php-config.yaml

