---
- name: Deploy Drupal hardened PHP-FPM configuration drop-in
  ansible.builtin.copy:
    src: 99-drupal-fpm.ini
    dest: /etc/php/8.3/fpm/conf.d/99-drupal.ini
    owner: root
    group: root
    mode: "0644"
  notify: reload php8.3-fpm

- name: Deploy Drupal PHP-CLI configuration drop-in
  ansible.builtin.copy:
    src: 99-drupal-cli.ini
    dest: /etc/php/8.3/cli/conf.d/99-drupal.ini
    owner: root
    group: root
    mode: "0644"

- name: Ensure PHP 8.3 FPM service is started and enabled on boot
  ansible.builtin.systemd:
    name: php8.3-fpm
    state: started
    enabled: true
