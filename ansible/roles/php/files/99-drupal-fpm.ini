; Hardening
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
allow_url_include = Off
cgi.fix_pathinfo = 0

; Session cookie hardening (HTTPS via Nginx + Certbot)
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

; If needed for 128MB uploads, set upload_max_filesize = 128M and post_max_size = 136M together
; Timezone & Drupal resource limits
date.timezone = Asia/Riyadh
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
max_input_vars = 3000
upload_max_filesize = 64M 
post_max_size = 72M

; OPcache tuning for Drupal 10/11
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
opcache.validate_timestamps = 1