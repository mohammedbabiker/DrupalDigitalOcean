[defaults]
inventory              = inventory/host.yaml
roles_path             = ./roles
forks                  = 10
timeout                = 30
playbook_dir           = .
nocows                 = True
pipelining             = True
host_key_checking      = False
callback_result_format = yaml
display_skipped_hosts  = False
retry_files_enabled    = False
interpreter_python     = auto_silent
vault_password_file    = .vault_password

[ssh_connection]
retries                = 3
ssh_args               = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=4
