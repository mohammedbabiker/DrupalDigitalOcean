- name: Set timezone
  ansible.builtin.lineinfile:
    path: /etc/php/8.3/fpm/php.ini
    regexp: '^date.timezone'
    line: 'date.timezone = Asia/Riyadh'
    state: present

- name: Set memory limit
  ansible.builtin.lineinfile:
    path: /etc/php/8.3/fpm/php.ini
    regexp: '^memory_limit'
    line: 'memory_limit = 512M'
    state: present

- name: Set upload max filesize
  ansible.builtin.lineinfile:
    path: /etc/php/8.3/fpm/php.ini
    regexp: '^upload_max_filesize'
    line: 'upload_max_filesize = 128M'
    state: present
  
- name: Set max execution time
  ansible.builtin.lineinfile:
    path: /etc/php/8.3/fpm/php.ini
    regexp: '^max_execution_time'
    line: 'max_execution_time = 600'
    state: present

- name: Fix cgi.fix_pathinfo
  ansible.builtin.lineinfile:
    path: /etc/php/8.3/fpm/php.ini
    regexp: '^cgi.fix_pathinfo'
    line: 'cgi.fix_pathinfo = 0'
    state: present

