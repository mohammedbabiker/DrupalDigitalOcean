---
- name: Deploy Drupal Stack on DigitalOcean
  hosts: server
  become: true

  roles:
    - role: hostname
      tags: [hostname, init]

    - role: essentials
      tags: [essentials, init]

    - role: database
      tags: [database, db]

    - role: php
      tags: [php]

    - role: nginx
      tags: [nginx, web]

    - role: certbot
      tags: [certbot, ssl]

