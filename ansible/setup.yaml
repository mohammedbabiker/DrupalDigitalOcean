---
- name: Deploy Drupal Stack on DigitalOcean
  hosts: server
  become: true
  gather_facts: true

  pre_tasks:
    - name: Ensure Ansible local facts directory exists
      ansible.builtin.file:
        path: /etc/ansible/facts.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [always]

  roles:
    - role: hostname
      tags: [hostname, init]

    - role: essentials
      tags: [essentials, init]

    - role: sysctl
      tags: [sysctl, security]

    - role: security 
      tags: [security]

    - role: database
      tags: [database, db]
      when: >
        not (ansible_local.bootstrap.state.database_done | default(false) | bool)
        or (force_database | default(false) | bool)

    - role: php
      tags: [php]

    - role: nginx
      tags: [nginx, web]

    - role: deploy
      tags: [deploy, drupal, app]

    - role: certbot
      tags: [certbot, ssl]
      when: >
        not (ansible_local.bootstrap.state.certbot_done | default(false) | bool)
        or (force_certbot | default(false) | bool)

    - role: drupal
      tags: [drupal_vhost, web]
