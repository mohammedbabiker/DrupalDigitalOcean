name: Drupal CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

  deploy:
    name: Deploy to Production VPS
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required secrets and playbook exist
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DRUPAL_REPO_URL: ${{ secrets.DRUPAL_REPO_URL }}
        run: |
          test -f ansible/release.yaml || { echo "ERROR: ansible/release.yaml not found in this repo"; exit 1; }
          for var in VPS_HOST VPS_USER VPS_SSH_KEY DRUPAL_REPO_URL; do
            test -n "${!var}" || { echo "ERROR: GitHub Secret $var is missing or empty"; exit 1; }
          done

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible-core
          ansible-galaxy collection install community.general

      - name: Configure SSH key and test connection
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Fails immediately if the secret is a .pub key, corrupted, or has a passphrase
          ssh-keygen -y -P "" -f ~/.ssh/deploy_key | ssh-keygen -lf -

          CLEAN_HOST="$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')"
          CLEAN_USER="$(printf '%s' "$VPS_USER" | tr -d '[:space:]')"
          ssh-keyscan -T 15 -H "$CLEAN_HOST" >> ~/.ssh/known_hosts

          # Direct SSH test before Ansible runs
          ssh -vv -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "${CLEAN_USER}@${CLEAN_HOST}" "echo SSH_OK"

      - name: Run Ansible release playbook
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DRUPAL_REPO_URL: ${{ secrets.DRUPAL_REPO_URL }}
        run: |
          CLEAN_HOST="$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')"
          CLEAN_USER="$(printf '%s' "$VPS_USER" | tr -d '[:space:]')"
          ansible-playbook ansible/release.yaml \
            -i "${CLEAN_HOST}," \
            -u "${CLEAN_USER}" \
            --private-key ~/.ssh/deploy_key \
            -e "ansible_user=${CLEAN_USER}" \
            -e "ansible_ssh_private_key_file=~/.ssh/deploy_key" \
            -e "github_repo_url=${DRUPAL_REPO_URL}" \
            -e "deploy_domain=mohammedworkspace.my.id"